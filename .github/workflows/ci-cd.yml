name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24 # the VPS's

      # pnpm at the version package.json names, through Node's own corepack: no third-party action.
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: [check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # One deploy at a time; a newer push waits for the one under way instead of cutting it short.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          # Ignored: the key may only run the command it's bound to in the panki user's
          # ~/.ssh/authorized_keys (pull main fast-forward only, then scripts/deploy.sh; docs/RUNNING.md).
          script: deploy
